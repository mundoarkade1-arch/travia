name: Flutter Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRAVIA_PRODUCTION_SIGNING: ${{ secrets.TRAVIA_KEYSTORE_BASE64 != '' && secrets.TRAVIA_STORE_PASSWORD != '' && secrets.TRAVIA_KEY_PASSWORD != '' && secrets.TRAVIA_KEY_ALIAS != '' }}
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Configure Android signing
        shell: bash
        env:
          TRAVIA_KEYSTORE_BASE64: ${{ secrets.TRAVIA_KEYSTORE_BASE64 }}
          TRAVIA_STORE_PASSWORD: ${{ secrets.TRAVIA_STORE_PASSWORD }}
          TRAVIA_KEY_PASSWORD: ${{ secrets.TRAVIA_KEY_PASSWORD }}
          TRAVIA_KEY_ALIAS: ${{ secrets.TRAVIA_KEY_ALIAS }}
        run: |
          if [ -n "${TRAVIA_KEYSTORE_BASE64:-}" ] && [ -n "${TRAVIA_STORE_PASSWORD:-}" ] && [ -n "${TRAVIA_KEY_PASSWORD:-}" ] && [ -n "${TRAVIA_KEY_ALIAS:-}" ]; then
            printf '%s' "$TRAVIA_KEYSTORE_BASE64" | base64 --decode > android/travia-upload-key.jks
            cat > android/key.properties <<EOF
          storePassword=$TRAVIA_STORE_PASSWORD
          keyPassword=$TRAVIA_KEY_PASSWORD
          keyAlias=$TRAVIA_KEY_ALIAS
          storeFile=travia-upload-key.jks
          EOF
            echo "Production signing configured from GitHub Secrets."
          elif [ -n "${TRAVIA_KEYSTORE_BASE64:-}${TRAVIA_STORE_PASSWORD:-}${TRAVIA_KEY_PASSWORD:-}${TRAVIA_KEY_ALIAS:-}" ]; then
            echo "Production signing Secrets are incomplete; refusing to build with ambiguous credentials." >&2
            exit 1
          else
            echo "Production signing Secrets are absent; enabling explicit debug signing for validation artifacts."
            echo "allowDebugSigning=true" >> android/gradle.properties
          fi
      - name: Build APK Release
        run: flutter build apk --release --no-pub
      - name: Build AAB Release
        run: flutter build appbundle --release --no-pub
      - name: Verify Android signatures
        shell: bash
        env:
          TRAVIA_KEYSTORE_BASE64: ${{ secrets.TRAVIA_KEYSTORE_BASE64 }}
          TRAVIA_STORE_PASSWORD: ${{ secrets.TRAVIA_STORE_PASSWORD }}
          TRAVIA_KEY_PASSWORD: ${{ secrets.TRAVIA_KEY_PASSWORD }}
          TRAVIA_KEY_ALIAS: ${{ secrets.TRAVIA_KEY_ALIAS }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          if [ -n "${TRAVIA_KEYSTORE_BASE64:-}" ] && [ -n "${TRAVIA_STORE_PASSWORD:-}" ] && [ -n "${TRAVIA_KEY_PASSWORD:-}" ] && [ -n "${TRAVIA_KEY_ALIAS:-}" ]; then
            jarsigner -verify -strict build/app/outputs/bundle/release/app-release.aab
          else
            jarsigner -verify build/app/outputs/bundle/release/app-release.aab
            echo "AAB verification completed with the expected debug/self-signed certificate warning."
          fi
      - name: Upload Android production artifacts
        if: ${{ env.TRAVIA_PRODUCTION_SIGNING == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: travia-android-production-signed
          if-no-files-found: error
          path: |
            flutter/build/app/outputs/flutter-apk/app-release.apk
            flutter/build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android validation artifacts (debug-signed)
        if: ${{ env.TRAVIA_PRODUCTION_SIGNING == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: travia-android-validation-debug
          if-no-files-found: error
          path: |
            flutter/build/app/outputs/flutter-apk/app-release.apk
            flutter/build/app/outputs/bundle/release/app-release.aab
